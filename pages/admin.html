<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador - Mi Tienda</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header id="main-header"></header>

    <section class="section" style="min-height: calc(100vh - 150px);">
        <div class="container">
            <div class="box shadow-lg" style="margin-top: 2rem;">
                <h1 class="title has-text-centered mb-5">Vista de Admin</h1>
                <p class="has-text-centered">Todavía no tiene contenido. Se avanzará por partes.</p>
            </div>
        </div>
    </section>

    <footer id="main-footer"></footer>

    <script type="module" src="../js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const user = JSON.parse(localStorage.getItem('loggedUser'));
            if (!user || user.tipo !== 'Administrador') {
                window.location.href = '/index.html'; // Basic protection
            }
        });
    </script>
</body>
</html>
