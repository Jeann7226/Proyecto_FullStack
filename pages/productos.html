<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Mi Tienda</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header id="main-header"></header>
    
    <main class="section min-vh-100">
        <div class="container">
            <h1 class="title has-text-centered mb-6">Todos Nuestros Productos</h1>
            <!-- El contenedor donde app.js inyectará la grilla de camisetas -->
            <div id="contenedor-productos" class="columns is-multiline">
                <!-- JavaScript inyectará las tarjetas aquí -->
            </div>
        </div>
    </main>

    <footer id="main-footer"></footer>
    
    <!-- Importamos app.js que es el encargado de dibujar los productos -->
    <script type="module" src="../js/app.js"></script>
</body>
</html>
